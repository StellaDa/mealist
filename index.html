<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F4EF"><meta name="description" content="Mealist – Plan meals. Shop smart."><link rel="manifest" href="manifest.webmanifest"><title>mealist. – Plan meals. Shop smart.</title><style>
:root{font-family:Arial,system-ui,sans-serif;color:#282624;background:#f7f4ef;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:620px;margin:auto;min-height:100dvh;padding:20px 17px 105px}.brand,.serif,h1,h2,h3{font-family:Georgia,serif}.brand{font-size:32px;font-weight:700;letter-spacing:-1.8px}.dot{color:#b87333}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#a35e32;font-weight:700}h1{font-size:35px;line-height:1.1;letter-spacing:-1px;margin:9px 0}h2{font-size:26px;margin:4px 0 15px}h3{font-size:20px;margin:0 0 12px}p{line-height:1.5;color:#66615c}.muted{color:#77706a;font-size:13px}.card{background:#fffdfb;border:1px solid #eee6de;border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 4px 15px #5c3b1b09}.hero{background:linear-gradient(135deg,#f3dfce,#fffaf5);padding:24px 20px;border-radius:24px;border:1px solid #ebd6c5}.hero p{margin-bottom:24px}.primary{border:0;background:#b87333;color:white;font-weight:700;border-radius:13px;padding:15px 18px;min-height:49px}.primary:active{background:#985923}.secondary{border:1px solid #d8b79c;background:#fffaf6;color:#8b4b22;font-weight:700;border-radius:13px;padding:12px 15px;min-height:45px}.ghost{border:0;background:transparent;color:#a65d2b;padding:9px;font-weight:700}.wide{width:100%}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:700;color:#54483e}input,textarea,select{width:100%;border:1px solid #e0d5cc;border-radius:12px;background:#fff;padding:12px;color:#292624;min-width:0}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:22px;height:22px;accent-color:#b87333;flex-shrink:0}.small{font-size:12px}.pill{border:1px solid #e6d9cf;background:#fff;border-radius:999px;padding:7px 11px;font-size:13px}.pill.active{background:#f3e0d0;border-color:#b87333;color:#904d20}.counter{display:flex;align-items:center;gap:8px;background:#f7f2ed;border-radius:12px;padding:3px}.counter button{width:34px;height:34px;border:0;background:#fff;border-radius:9px;color:#8c4b25;font-size:21px}.counter b{min-width:18px;text-align:center}.day{border-top:1px solid #f0e8e1;padding:12px 0}.meal{display:flex;align-items:center;gap:8px;margin-top:10px}.meal .grow{font-size:14px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#292725;color:#f6f1eb;display:flex;justify-content:space-around;padding:10px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0002}.nav button{background:none;border:0;color:#d7d0c9;display:grid;gap:4px;justify-items:center;font-size:11px;min-width:66px}.nav button.active{color:#e8a36c}.nav .symbol{font-size:22px}.sticky{position:sticky;bottom:92px;background:#f7f4efed;padding:12px 0 3px}.recipe{display:flex;align-items:center;gap:12px}.recipe .emoji{font-size:30px;background:#f7e7d7;border-radius:13px;padding:12px}.checkline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0eae4}.checkline.done .itemname{text-decoration:line-through;color:#999}.category{font-size:17px;font-family:Georgia,serif;margin:16px 0 7px}.progress{height:7px;border-radius:99px;background:#e8ded5;overflow:hidden}.progress>div{height:100%;background:#b87333;transition:width .2s}.notice{background:#fff3df;border-radius:12px;padding:12px;font-size:13px;color:#775021}.empty{text-align:center;padding:28px 10px;color:#82756a}.tinybtn{border:0;background:#f5e8dc;color:#8d4e26;border-radius:10px;padding:8px 10px;font-size:13px}.section{margin-top:22px}.tabline{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabline button{white-space:nowrap}.hide{display:none!important}@media(min-width:700px){.nav{max-width:620px;margin:auto;border-radius:22px 22px 0 0}.app{padding-top:30px}}
</style></head><body><main class="app"><header class="top"><div class="brand">mealist<span class="dot">.</span></div><button class="ghost" onclick="go('settings')" aria-label="Einstellungen">⚙</button></header><div id="view"></div></main><nav class="nav" aria-label="Hauptnavigation"><button data-tab="home" onclick="go('home')"><span class="symbol">⌂</span>Start</button><button data-tab="plan" onclick="go('plan')"><span class="symbol">▦</span>Plan</button><button data-tab="shop" onclick="go('shop')"><span class="symbol">▤</span>Einkauf</button><button data-tab="recipes" onclick="go('recipes')"><span class="symbol">▧</span>Rezepte</button></nav><script>
'use strict';const KEY='mealist-mvp-v1';const cats=['Obst & Gemüse','Fleisch & Fisch','Kühlregal & Milchprodukte','Backwaren','Trockenwaren & Konserven','Tiefkühlkost','Getränke','Drogerie & Haushalt','Sonstiges'];const initial=()=>({recipes:[{id:'r1',name:'Pasta Primavera',servings:4,minutes:25,steps:'Nudeln kochen. Gemüse anbraten, alles vermengen und abschmecken.',ingredients:[{name:'Nudeln',amount:400,unit:'g',category:4},{name:'Tomaten',amount:300,unit:'g',category:0},{name:'Zucchini',amount:1,unit:'Stück',category:0},{name:'Parmesan',amount:100,unit:'g',category:2}]},{id:'r2',name:'Gemüse-Curry',servings:4,minutes:35,steps:'Reis kochen. Gemüse anbraten und mit Kokosmilch köcheln lassen.',ingredients:[{name:'Reis',amount:300,unit:'g',category:4},{name:'Paprika',amount:2,unit:'Stück',category:0},{name:'Kokosmilch',amount:400,unit:'ml',category:4}]}],articles:[{id:'a1',name:'Milch',amount:1,unit:'l',category:2},{id:'a2',name:'Brot',amount:1,unit:'Stück',category:3},{id:'a3',name:'Kaffee',amount:1,unit:'Packung',category:6}],plan:{start:today(),end:plusDays(today(),6),slots:{}},manual:[],checks:{},overrides:{}});function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function plusDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dateList(){let a=[],s=state.plan.start,e=state.plan.end;if(!s||!e||e<s)return a;for(let i=0;i<62;i++){let d=plusDays(s,i);if(d>e)break;a.push(d)}return a}function fmtDate(d){return new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'))}let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));let screen='home',recipeEdit=null,recipePick=null,recipeSearch='',articleSearch='';const el=document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);function go(s){screen=s;render();scrollTo(0,0)}function countPlanned(){return Object.values(state.plan.slots).filter(x=>x.enabled&&x.recipeId).length}function counter(n,action){return `<div class="counter"><button aria-label="Weniger" onclick="${action.endsWith(',')?action+'-1)':action+'(-1)'}">−</button><b>${n}</b><button aria-label="Mehr" onclick="${action.endsWith(',')?action+'1)':action+'(1)'}">+</button></div>`}function slot(date,kind){let key=date+'_'+kind;return state.plan.slots[key]||(state.plan.slots[key]={enabled:false,people:3,recipeId:null})}function updateSlot(date,kind,field,val){let s=slot(date,kind);if(field==='people')s.people=Math.max(1,Math.min(30,s.people+val));else s[field]=val;save();render()}function setPeriod(field,value){state.plan[field]=value;save();render()}function startPlan(){go('plan')}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===screen));el.innerHTML=({home:homeView,plan:planView,recipes:recipesView,recipeEdit:recipeEditView,recipeDetail:recipeDetailView,shop:shopView,articles:articlesView,settings:settingsView,pick:pickView})[screen]?.()||homeView()}
function homeView(){return `<div class="eyebrow">Plan meals. Shop smart.</div><div class="hero"><h1>Was kochen wir diese Woche?</h1><p>Deine Mahlzeiten planen, Rezepte entdecken und den Einkauf automatisch organisieren.</p><button class="primary wide" onclick="startPlan()">Planung starten →</button></div><div class="grid2 section"><button class="secondary" onclick="go('recipes')">▧ Rezepte entdecken</button><button class="secondary" onclick="newRecipe()">＋ Rezept hinzufügen</button><button class="secondary" onclick="go('plan')">▦ Aktueller Plan</button><button class="secondary" onclick="go('shop')">▤ Einkaufsliste</button></div><div class="card"><div class="eyebrow">Dein aktueller Zeitraum</div><h3>${esc(fmtDate(state.plan.start))} – ${esc(fmtDate(state.plan.end))}</h3><p>${countPlanned()} Gerichte geplant · ${state.recipes.length} Rezepte gespeichert</p></div>`}
function planView(){let dates=dateList();return `<div class="eyebrow">Schritt 1 · Mahlzeiten planen</div><h2>Deine Küchenwoche</h2><div class="card"><div class="grid2"><div class="field"><label>Von</label><input type="date" value="${state.plan.start}" onchange="setPeriod('start',this.value)"></div><div class="field"><label>Bis (max. 62 Tage)</label><input type="date" value="${state.plan.end}" onchange="setPeriod('end',this.value)"></div></div><div class="row between"><span class="muted">Personen für alle aktiven Mahlzeiten</span>${counter(Object.values(state.plan.slots).find(s=>s.enabled)?.people||3,'changeAllPeople')}</div></div>${dates.length?dates.map(d=>`<div class="card"><h3>${esc(fmtDate(d))}</h3>${['lunch','dinner'].map(k=>{let s=slot(d,k);return `<div class="day"><div class="meal"><input aria-label="${k==='lunch'?'Mittagessen':'Abendessen'} aktivieren" type="checkbox" ${s.enabled?'checked':''} onchange="updateSlot('${d}','${k}','enabled',this.checked)"><span class="grow">${k==='lunch'?'Mittagessen':'Abendessen'}</span>${s.enabled?counter(s.people,`changePeople('${d}','${k}',`):''}</div>${s.enabled?`<div class="row between" style="margin:8px 0 0 31px"><span class="muted">${s.recipeId?esc(state.recipes.find(r=>r.id===s.recipeId)?.name||'Rezept fehlt'):'Noch kein Rezept'}</span><button class="tinybtn" onclick="pickRecipe('${d}','${k}')">${s.recipeId?'Ändern':'Rezept wählen'} →</button></div>`:''}</div>`}).join('')}</div>`).join(''):`<div class="notice">Bitte einen gültigen Zeitraum von maximal 62 Tagen auswählen.</div>`}<div class="sticky"><button class="primary wide" onclick="go('shop')">Einkaufsliste anzeigen →</button></div>`}function changePeople(d,k,delta){updateSlot(d,k,'people',delta)}function changeAllPeople(delta){let slots=Object.values(state.plan.slots).filter(s=>s.enabled);let n=slots.length?(slots[0].people||3):3;n=Math.max(1,Math.min(30,n+delta));slots.forEach(s=>s.people=n);save();render()}
function pickRecipe(d,k){recipePick={d,k};recipeSearch='';go('pick')}function pickView(){let s=slot(recipePick.d,recipePick.k);return `<button class="ghost" onclick="go('plan')">← Zurück zum Plan</button><div class="eyebrow">${esc(fmtDate(recipePick.d))} · ${recipePick.k==='lunch'?'Mittagessen':'Abendessen'} · ${s.people} Personen</div><h2>Rezept auswählen</h2><input placeholder="Rezept suchen ..." value="${esc(recipeSearch)}" oninput="recipeSearch=this.value;refreshPick()" id="pickSearch"><div id="pickResults">${pickResults()}</div><div class="card"><button class="secondary wide" onclick="newRecipe(true)">＋ Neues Rezept erstellen</button></div>`}function refreshPick(){document.getElementById('pickResults').innerHTML=pickResults()}function pickResults(){return state.recipes.filter(r=>r.name.toLowerCase().includes(recipeSearch.toLowerCase())).map(r=>`<div class="card recipe"><div class="emoji">🍽</div><div class="grow"><b>${esc(r.name)}</b><div class="muted">${r.minutes||'–'} Min. · ${r.servings} Portionen</div></div><button class="tinybtn" onclick="assignRecipe('${r.id}')">Wählen</button></div>`).join('')+`<button class="secondary wide" onclick="randomRecipe()" ${state.recipes.length?'':'disabled'}>⤨ Zufallsrezept auswählen</button>`}function assignRecipe(id){slot(recipePick.d,recipePick.k).recipeId=id;save();go('plan')}function randomRecipe(){if(state.recipes.length)assignRecipe(state.recipes[Math.floor(Math.random()*state.recipes.length)].id)}
function recipesView(){return `<div class="row between"><h2>Meine Rezepte</h2><button class="tinybtn" onclick="newRecipe()">＋ Neu</button></div><div class="notice">Rezeptimport per URL folgt in einem späteren Entwicklungsschritt. Rezepte kannst du bereits manuell erfassen.</div>${state.recipes.map(r=>`<div class="card recipe"><div class="emoji">🍲</div><div class="grow"><b>${esc(r.name)}</b><div class="muted">${r.servings} Portionen · ${r.minutes||'–'} Min.</div></div><button class="tinybtn" onclick="recipeEdit='${r.id}';go('recipeDetail')">Öffnen</button></div>`).join('')||'<div class="empty">Noch keine Rezepte gespeichert.</div>'}<button class="secondary wide" onclick="newRecipe()">＋ Rezept hinzufügen</button>`}function newRecipe(fromPick=false){recipeEdit=null;window.fromPick=fromPick;go('recipeEdit')}function recipeDetailView(){let r=state.recipes.find(x=>x.id===recipeEdit);if(!r)return recipesView();return `<button class="ghost" onclick="go('recipes')">← Rezepte</button><h1>${esc(r.name)}</h1><p>${r.servings} Portionen · ${r.minutes||'–'} Minuten</p><div class="card"><h3>Zutaten</h3>${r.ingredients.map(i=>`<div class="checkline"><b>${esc(i.amount)} ${esc(i.unit)}</b> ${esc(i.name)}</div>`).join('')}</div><div class="card"><h3>Zubereitung</h3><p style="white-space:pre-wrap">${esc(r.steps||'Noch keine Anleitung')}</p></div><div class="grid2"><button class="secondary" onclick="go('recipeEdit')">Bearbeiten</button><button class="secondary" onclick="deleteRecipe('${r.id}')">Löschen</button></div>`}function deleteRecipe(id){if(!confirm('Rezept wirklich löschen? Bereits zugeordnete Mahlzeiten bleiben ohne Rezept.'))return;state.recipes=state.recipes.filter(r=>r.id!==id);Object.values(state.plan.slots).forEach(s=>{if(s.recipeId===id)s.recipeId=null});save();go('recipes')}
function recipeEditView(){let r=state.recipes.find(x=>x.id===recipeEdit);let ingredients=r?.ingredients||[{name:'',amount:1,unit:'g',category:4}];return `<button class="ghost" onclick="go('${window.fromPick?'pick':r?'recipeDetail':'recipes'}')">← Zurück</button><h2>${r?'Rezept bearbeiten':'Neues Rezept'}</h2><form id="recipeForm" onsubmit="saveRecipe(event)"><div class="field"><label>Rezeptname *</label><input name="name" required value="${esc(r?.name||'')}"></div><div class="grid2"><div class="field"><label>Basisportionen *</label><input name="servings" type="number" min="1" max="100" required value="${r?.servings||3}"></div><div class="field"><label>Zeit (Minuten)</label><input name="minutes" type="number" min="0" value="${r?.minutes||''}"></div></div><h3>Zutaten</h3><div id="ingredientFields">${ingredients.map((i,n)=>ingredientField(i,n)).join('')}</div><button type="button" class="secondary" onclick="addIngredient()">＋ Zutat</button><div class="field"><label>Zubereitung</label><textarea name="steps">${esc(r?.steps||'')}</textarea></div><button class="primary wide" type="submit">Rezept speichern</button></form>`}function ingredientField(i,n){return `<div class="card ingredient"><div class="row between"><b>Zutat ${n+1}</b><button type="button" class="ghost" onclick="this.closest('.ingredient').remove()">Entfernen</button></div><div class="field"><label>Name</label><input data-f="name" required value="${esc(i.name)}" placeholder="z. B. Tomaten"></div><div class="grid2"><div class="field"><label>Menge</label><input data-f="amount" type="number" min="0" step="any" required value="${i.amount}"></div><div class="field"><label>Einheit</label><select data-f="unit">${['g','kg','ml','l','Stück','EL','TL','Dose','Packung','Bund','Zehe','Prise'].map(u=>`<option ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div><div class="field"><label>Supermarktabteilung</label><select data-f="category">${cats.map((c,j)=>`<option value="${j}" ${i.category===j?'selected':''}>${c}</option>`).join('')}</select></div></div>`}function addIngredient(){let e=document.getElementById('ingredientFields');e.insertAdjacentHTML('beforeend',ingredientField({name:'',amount:1,unit:'g',category:4},e.children.length))}function saveRecipe(ev){ev.preventDefault();let f=ev.target,ing=[...f.querySelectorAll('.ingredient')].map(e=>({name:e.querySelector('[data-f=name]').value.trim(),amount:Number(e.querySelector('[data-f=amount]').value),unit:e.querySelector('[data-f=unit]').value,category:Number(e.querySelector('[data-f=category]').value)})).filter(x=>x.name);if(!ing.length){alert('Bitte mindestens eine Zutat angeben.');return}let id=recipeEdit||uid(),r={id,name:f.elements.name.value.trim(),servings:Number(f.elements.servings.value),minutes:Number(f.elements.minutes.value)||null,steps:f.elements.steps.value,ingredients:ing};if(recipeEdit)state.recipes=state.recipes.map(x=>x.id===id?r:x);else state.recipes.push(r);recipeEdit=id;save();go(window.fromPick?'pick':'recipeDetail')}
function normalized(i){let unit=i.unit,amount=Number(i.amount);if(unit==='kg'){unit='g';amount*=1000}else if(unit==='l'){unit='ml';amount*=1000}return {unit,amount}}function listItems(){let map=new Map();for(let [key,s] of Object.entries(state.plan.slots)){if(!s.enabled||!s.recipeId||!key.slice(0,10))continue;let d=key.slice(0,10);if(d<state.plan.start||d>state.plan.end)continue;let r=state.recipes.find(r=>r.id===s.recipeId);if(!r)continue;for(let i of r.ingredients){let x=normalized(i),k='recipe:'+i.name.trim().toLowerCase()+'|'+x.unit+'|'+i.category;if(!map.has(k))map.set(k,{key:k,name:i.name,amount:0,unit:x.unit,category:i.category,source:'recipe'});map.get(k).amount+=x.amount*s.people/r.servings}}for(let i of state.manual){let x=normalized(i),k='manual:'+i.id;map.set(k,{key:k,name:i.name,amount:x.amount,unit:x.unit,category:i.category,source:'manual'})}return [...map.values()].map(i=>({...i,amount:state.overrides[i.key]?.amount??i.amount,category:state.overrides[i.key]?.category??i.category})).sort((a,b)=>a.category-b.category||a.name.localeCompare(b.name,'de'))}function fmtAmount(n){return Number(n.toFixed(3)).toLocaleString('de-DE',{maximumFractionDigits:3})}function shopView(){let items=listItems(),done=items.filter(i=>state.checks[i.key]).length;return `<div class="row between"><h2>Einkaufsliste</h2><button class="tinybtn" onclick="go('articles')">＋ Artikel</button></div><p class="muted">${esc(fmtDate(state.plan.start))} – ${esc(fmtDate(state.plan.end))}</p><div class="card"><div class="row between"><b>Einkaufsfortschritt</b><span class="muted">${done} / ${items.length}</span></div><div class="progress" style="margin-top:12px"><div style="width:${items.length?done/items.length*100:0}%"></div></div></div>${items.length?cats.map((c,n)=>{let group=items.filter(i=>i.category===n);return group.length?`<div class="card"><h3>${c}</h3>${group.map(i=>`<div class="checkline ${state.checks[i.key]?'done':''}"><input type="checkbox" aria-label="${esc(i.name)} abhaken" ${state.checks[i.key]?'checked':''} onchange="checkItem('${esc(i.key)}',this.checked)"><span class="grow itemname"><b>${fmtAmount(i.amount)} ${esc(i.unit)}</b> ${esc(i.name)}</span><button class="tinybtn" onclick="editItem('${esc(i.key)}')" aria-label="Artikel bearbeiten">⋯</button></div>`).join('')}</div>`:''}).join(''):'<div class="empty">Deine Liste ist noch leer. Wähle zuerst Rezepte im Mahlzeitenplan oder füge Artikel hinzu.</div>'}<div class="sticky"><button class="primary wide" onclick="go('articles')">＋ Artikel hinzufügen</button></div>`}function checkItem(k,v){state.checks[k]=v;save();render()}function editItem(k){let i=listItems().find(i=>i.key===k);if(!i)return;let a=prompt('Menge für '+i.name+' ('+i.unit+')',String(i.amount));if(a===null)return;let n=Number(a.replace(',','.'));if(!Number.isFinite(n)||n<0){alert('Bitte gültige Menge eingeben.');return}let c=prompt('Kategorie (0–8):\n'+cats.map((x,j)=>j+': '+x).join('\n'),String(i.category));if(c===null)return;let cat=Number(c);if(!Number.isInteger(cat)||cat<0||cat>=cats.length){alert('Ungültige Kategorie.');return}if(i.source==='manual'){let m=state.manual.find(x=>'manual:'+x.id===k);if(m){m.amount=n;m.unit=i.unit;m.category=cat}}else state.overrides[k]={amount:n,category:cat};save();render()}
function articlesView(){return `<button class="ghost" onclick="go('shop')">← Einkaufsliste</button><h2>Artikel hinzufügen</h2><p class="muted">Aus deiner Artikelbibliothek oder als neuer Artikel.</p><input placeholder="Artikel suchen ..." value="${esc(articleSearch)}" oninput="articleSearch=this.value;document.getElementById('articleResults').innerHTML=articleResults()"><div id="articleResults">${articleResults()}</div><div class="card"><h3>Neuen Artikel anlegen</h3><form onsubmit="createArticle(event)"><div class="field"><label>Artikelname</label><input name="name" required placeholder="z. B. Hafermilch"></div><div class="grid2"><div class="field"><label>Standardmenge</label><input name="amount" type="number" min="0" step="any" value="1" required></div><div class="field"><label>Einheit</label><select name="unit">${['Stück','g','kg','ml','l','Packung','Dose','Bund'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Kategorie</label><select name="category">${cats.map((x,j)=>`<option value="${j}">${x}</option>`).join('')}</select></div><button class="secondary wide">In Bibliothek speichern</button></form></div>`}function articleResults(){return state.articles.filter(x=>x.name.toLowerCase().includes(articleSearch.toLowerCase())).map(a=>`<div class="card row"><div class="grow"><b>${esc(a.name)}</b><div class="muted">${fmtAmount(a.amount)} ${esc(a.unit)} · ${cats[a.category]}</div></div><button class="tinybtn" onclick="addManual('${a.id}')">＋ Liste</button><button class="ghost" onclick="deleteArticle('${a.id}')" aria-label="Artikel löschen">×</button></div>`).join('')||'<p class="muted">Keine passenden Artikel.</p>'}function addManual(id){let a=state.articles.find(x=>x.id===id);if(!a)return;state.manual.push({...a,id:uid()});save();go('shop')}function deleteArticle(id){if(!confirm('Artikel aus Bibliothek löschen?'))return;state.articles=state.articles.filter(a=>a.id!==id);save();render()}function createArticle(e){e.preventDefault();let f=e.target;state.articles.push({id:uid(),name:f.elements.name.value.trim(),amount:Number(f.elements.amount.value),unit:f.elements.unit.value,category:Number(f.elements.category.value)});save();render()}
function settingsView(){return `<h2>Einstellungen & Daten</h2><div class="card"><h3>Deine Daten</h3><p>Mealist speichert diese erste Version lokal im Browser dieses Geräts. Sichere deine Daten regelmäßig.</p><button class="primary wide" onclick="exportData()">Backup herunterladen</button><div class="field"><label>Backup wiederherstellen (JSON)</label><input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></div></div><div class="card"><h3>Über diese Version</h3><p>Mealist MVP 0.1 · Lokale Speicherung · Ohne Anmeldung</p><p class="muted">Noch nicht enthalten: automatischer URL-Rezeptimport, vollständige Offline-PWA und erweiterte Artikelverwaltung.</p></div>`}function exportData(){let blob=new Blob([JSON.stringify({format:'mealist-v1',data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mealist-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(f){if(!f)return;try{let o=JSON.parse(await f.text());if(o.format!=='mealist-v1'||!o.data||!Array.isArray(o.data.recipes)||!Array.isArray(o.data.articles)||!o.data.plan||!Array.isArray(o.data.manual))throw Error('Ungültiges Mealist-Backup');if(!confirm('Alle aktuellen Daten durch dieses Backup ersetzen?'))return;state=o.data;save();go('home');alert('Backup wiederhergestellt.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
