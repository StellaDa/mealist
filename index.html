'use strict';const KEY='mealist-mvp-v1';const cats=['Obst & Gemüse','Fleisch & Fisch','Kühlregal & Milchprodukte','Backwaren','Trockenwaren & Konserven','Tiefkühlkost','Getränke','Drogerie & Haushalt','Sonstiges'];const initial=()=>({recipes:[{id:'r1',name:'Pasta Primavera',servings:4,minutes:25,steps:'Nudeln kochen. Gemüse anbraten, alles vermengen und abschmecken.',ingredients:[{name:'Nudeln',amount:400,unit:'g',category:4},{name:'Tomaten',amount:300,unit:'g',category:0},{name:'Zucchini',amount:1,unit:'Stück',category:0},{name:'Parmesan',amount:100,unit:'g',category:2}]},{id:'r2',name:'Gemüse-Curry',servings:4,minutes:35,steps:'Reis kochen. Gemüse anbraten und mit Kokosmilch köcheln lassen.',ingredients:[{name:'Reis',amount:300,unit:'g',category:4},{name:'Paprika',amount:2,unit:'Stück',category:0},{name:'Kokosmilch',amount:400,unit:'ml',category:4}]}],articles:[{id:'a1',name:'Milch',amount:1,unit:'l',category:2},{id:'a2',name:'Brot',amount:1,unit:'Stück',category:3},{id:'a3',name:'Kaffee',amount:1,unit:'Packung',category:6}],plan:{start:today(),end:plusDays(today(),6),slots:{}},manual:[],checks:{},overrides:{}});function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function plusDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dateList(){let a=[],s=state.plan.start,e=state.plan.end;if(!s||!e||e<s)return a;for(let i=0;i<7;i++){let d=plusDays(s,i);if(d>e)break;a.push(d)}return a}function fmtDate(d){return new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'))}let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));let screen='home',recipeEdit=null,recipePick=null,recipeSearch='',articleSearch='' function planView(){ensureMealPool();let dates=dateList(),wd=['So','Mo','Di','Mi','Do','Fr','Sa'];let periodLabel=state.plan.start===state.plan.end?fmtDate(state.plan.start):fmtDate(state.plan.start)+' – '+fmtDate(state.plan.end);let chosen=state.recipePool.slice(0,state.mealCount).filter(p=>p.recipeId&&state.recipes.some(r=>r.id===p.recipeId)).length;return `<div class="eyebrow">DEIN KOCHPLAN</div><h2>Was kochen wir?</h2><div class="plan-settings-summary"><div><strong>${esc(periodLabel)}</strong><div class="muted">${dates.length} ${dates.length===1?'Tag':'Tage'} · Einkaufszeitraum</div></div><button class="tinybtn" onclick="togglePlanSettings()">${planSettingsOpen?'Schließen':'⚙ Zeitraum ändern'}</button></div>${planSettingsOpen?`<div class="card plan-settings"><div class="grid2"><div class="field"><label>Von</label><input type="date" value="${state.plan.start}" onchange="setPeriod('start',this.value)"></div><div class="field"><label>Bis (max. 7 Tage)</label><input type="date" value="${state.plan.end}" onchange="setPeriod('end',this.value)"></div></div></div>`:''}<div class="plan-week">${dates.map(day=>{let date=new Date(day+'T12:00:00');return `<div class="plan-week-day" style="cursor:default"><span>${wd[date.getDay()]}</span><b>${date.getDate()}</b></div>`}).join('')}</div><div class="card"><h3>Wie viele Mahlzeiten möchtest du kochen?</h3><div class="row between"><span class="muted">Für diesen Einkaufszeitraum</span>${counter(state.mealCount,'changeMealCount')}</div></div><div class="plan-pool"><div class="row between"><h3>Deine Gerichte</h3><span class="muted">${chosen} von ${state.mealCount} ausgewählt</span></div>${state.recipePool.slice(0,state.mealCount).map((p,i)=>{let r=state.recipes.find(x=>x.id===p.recipeId);let img=r&&recipeImage(r);return `<div class="pool-item" style="gap:12px;align-items:center">${img?`<img src="${esc(img)}" alt="" loading="lazy" style="width:58px;height:58px;object-fit:cover;border-radius:12px;flex-shrink:0" onerror="this.style.display='none'">`:`<div class="emoji" style="width:58px;height:58px;min-width:58px">${r?'🍲':'＋'}</div>`}<div class="grow"><strong>${r?esc(r.name):'Noch kein Rezept ausgewählt'}</strong><div class="muted">${r?`${p.people||3} Portionen`:`Gericht ${i+1}`}</div></div><button class="tinybtn" onclick="pickPoolRecipe(${i})">${r?'Ändern':'Auswählen'}</button></div>`}).join('')}</div><button class="plan-reset" onclick="resetCurrentWeek()">↺ Kochplan zurücksetzen</button><div class="sticky"><button class="primary wide" onclick="go('shop')">Einkaufsliste anzeigen →</button></div>`}
function planNeeds(){let a=[];for(let d of dateList())for(let k of ['lunch','dinner']){let sl=slot(d,k);if(sl.enabled)a.push({people:sl.people,kind:k})}return a}
function syncRecipePool(){ensureMealPool();save()}

function pickRecipe(d,k){recipePick={d,k};recipeSearch='';go('pick')}function pickView(){let s=recipePick.poolIndex!==undefined?state.recipePool[recipePick.poolIndex]:slot(recipePick.d,recipePick.k);return `<button class="ghost" onclick="backToDay()">← Zurück zum Plan</button><div class="eyebrow">${recipePick.poolIndex!==undefined?'Flexibler Kochplan':esc(fmtDate(recipePick.d))+' · '+(recipePick.k==='lunch'?'Mittagessen':'Abendessen')}</div><h2>Rezept auswählen</h2>${recipePick.poolIndex!==undefined?`<div class="card"><div class="row between"><strong>Für wie viele Portionen?</strong>${counter(s.people||3,`changePoolPeople(${recipePick.poolIndex},`)}</div></div>`:''}<input placeholder="Rezept suchen ..." value="${esc(recipeSearch)}" oninput="recipeSearch=this.value;refreshPick()" id="pickSearch"><div id="pickResults">${pickResults()}</div><div class="card"><button class="secondary wide" onclick="newRecipe(true)">＋ Neues Rezept erstellen</button></div>`}function refreshPick(){document.getElementById('pickResults').innerHTML=pickResults()}function pickResults(){return state.recipes.filter(r=>r.name.toLowerCase().includes(recipeSearch.toLowerCase())).map(r=>`<div class="card recipe">${recipeImage(r)?`<div class="emoji" style="width:72px;height:72px;min-width:72px;flex:0 0 72px;padding:0;background:transparent;overflow:hidden;border-radius:13px"><img src="${esc(recipeImage(r))}" alt="" loading="lazy" style="display:block;width:72px;height:72px;object-fit:cover;border-radius:13px" onerror="this.style.display=\'none\'"></div>`:`<div class="emoji">🍲</div>`}<div class="grow"><b>${esc(r.name)}</b><div class="muted">${r.minutes||'–'} Min. · ${r.servings} Portionen</div></div><button class="tinybtn" onclick="assignRecipe('${r.id}')">Wählen</button></div>`).join('')+`<button class="secondary wide" onclick="randomRecipe()" ${state.recipes.length?'':'disabled'}>⤨ Zufallsrezept auswählen</button>`}function assignRecipe(id){let sl=recipePick.poolIndex!==undefined?state.recipePool[recipePick.poolIndex]:slot(recipePick.d,recipePick.k);if(sl.recipeId!==id){sl.selectedOptional=[];sl.optionReminder=false}sl.recipeId=id;save();backToDay()}function backToDay(){screen='plan';render();requestAnimationFrame(()=>document.querySelector('.plan-pool')?.scrollIntoView({block:'start'}))}function randomRecipe(){if(state.recipes.length)assignRecipe(state.recipes[Math.floor(Math.random()*state.recipes.length)].id)}
function recipeImage(r){let u=r?.image||'';return typeof u==='string'&&(u.startsWith('https://')||u.startsWith('http://')||u.startsWith('data:image/'))?u:''}

function imageEditor(r){let u=draftRecipeImage===null?recipeImage(r):draftRecipeImage;return '<div class="field"><label>Rezeptbild</label><div id="recipeImagePreview">'+imagePreview({image:u})+'</div><input type="file" accept="image/*" onchange="uploadRecipeImage(this)"><button type="button" class="ghost" onclick="draftRecipeImage=\'\';document.getElementById(\'recipeImagePreview\').innerHTML=\'\'">Bild entfernen</button><p class="muted">Fotos werden für die lokale Speicherung verkleinert. Bitte regelmäßig ein Backup erstellen.</p></div>'}
async function uploadRecipeImage(input){let file=input.files?.[0];if(!file)return;try{if(!file.type.startsWith('image/'))throw Error('Bitte ein Bild auswählen');let bmp=await createImageBitmap(file);let scale=Math.min(1,900/Math.max(bmp.width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();draftRecipeImage=canvas.toDataURL('image/jpeg',.7);document.getElementById('recipeImagePreview').innerHTML=imagePreview({image:draftRecipeImage})}catch(e){alert('Bild konnte nicht geladen werden: '+e.message)}}
function recipesView(){return `<div class="row between"><h2>Meine Rezepte</h2><button class="tinybtn" onclick="newRecipe()">＋ Neu</button></div><button class="secondary wide" onclick="go('importRecipe')">↗ Rezept importieren (URL oder Text)</button>${state.recipes.map(r=>`<div class="card recipe">${recipeImage(r)?`<div class="emoji" style="width:72px;height:72px;min-width:72px;flex:0 0 72px;padding:0;background:transparent;overflow:hidden;border-radius:13px"><img src="${esc(recipeImage(r))}" alt="" loading="lazy" style="display:block;width:72px;height:72px;object-fit:cover;border-radius:13px" onerror="this.style.display=\'none\'"></div>`:`<div class="emoji">🍲</div>`}<div class="grow"><b>${esc(r.name)}</b><div class="muted">${r.servings} Portionen · ${r.minutes||'–'} Min.</div></div><button class="tinybtn" onclick="recipeEdit='${r.id}';go('recipeDetail')">Öffnen</button></div>`).join('')||'<div class="empty">Noch keine Rezepte gespeichert.</div>'}<button class="secondary wide" onclick="newRecipe()">＋ Rezept hinzufügen</button>`}function newRecipe(fromPick=false){draftRecipeImage=null;recipeEdit=null;window.fromPick=fromPick;go('recipeEdit')}function recipeDetailView(){let r=state.recipes.find(x=>x.id===recipeEdit);if(!r)return recipesView();return `<button class="ghost" onclick="go('recipes')">← Rezepte</button><h1>${esc(r.name)}</h1>${imagePreview(r)}<p>${r.servings} Portionen · ${r.minutes||'–'} Minuten</p><div class="card"><h3>Zutaten</h3>${r.ingredients.map(i=>`<div class="checkline"><b>${esc(i.amount)} ${esc(i.unit)}</b> ${esc(i.name)}</div>`).join('')}</div><div class="card"><h3>Zubereitung</h3><p style="white-space:pre-wrap">${esc(r.steps||'Noch keine Anleitung')}</p></div><div class="grid2"><button class="secondary" onclick="go('recipeEdit')">Bearbeiten</button><button class="secondary" onclick="deleteRecipe('${r.id}')">Löschen</button></div>`}function deleteRecipe(id){if(!confirm('Rezept wirklich löschen? Bereits zugeordnete Mahlzeiten bleiben ohne Rezept.'))return;state.recipes=state.recipes.filter(r=>r.id!==id);Object.values(state.plan.slots).forEach(s=>{if(s.recipeId===id)s.recipeId=null});save();go('recipes')}
function recipeEditView(){let r=state.recipes.find(x=>x.id===recipeEdit);let ingredients=r?.ingredients||[{name:'',amount:1,unit:'g',category:4}];return `<button class="ghost" onclick="go('${window.fromPick?'pick':r?'recipeDetail':'recipes'}')">← Zurück</button><h2>${r?'Rezept bearbeiten':'Neues Rezept'}</h2><form id="recipeForm" onsubmit="saveRecipe(event)"><div class="field"><label>Rezeptname *</label><input name="name" required value="${esc(r?.name||'')}"></div><div class="grid2"><div class="field"><label>Basisportionen *</label><input name="servings" type="number" min="1" max="100" required value="${r?.servings||3}"></div><div class="field"><label>Zeit (Minuten)</label><input name="minutes" type="number" min="0" value="${r?.minutes||''}"></div></div>${imageEditor(r)}<h3>Zutaten</h3><div id="ingredientFields">${ingredients.map((i,n)=>ingredientField(i,n)).join('')}</div><button type="button" class="secondary" onclick="addIngredient()">＋ Zutat</button><h3 style="margin-top:24px">Flexible Zutaten</h3><p class="muted">Beläge oder Füllungen: Erst beim Planen auswählen.</p><div id="optionalFields">${(r?.optionalIngredients||[]).map((i,n)=>ingredientField(i,n)).join('')}</div><button type="button" class="secondary" onclick="addOptional()">＋ Vorschlag hinzufügen</button><div class="field"><label>Zubereitung</label><textarea name="steps">${esc(r?.steps||'')}</textarea></div><button class="primary wide" type="submit">Rezept speichern</button></form>`}function ingredientField(i,n){return `<div class="card ingredient"><div class="row between"><b>Zutat ${n+1}</b><button type="button" class="ghost" onclick="this.closest('.ingredient').remove()">Entfernen</button></div><div class="field"><label>Name</label><input data-f="name" required value="${esc(i.name)}" placeholder="z. B. Tomaten" onblur="autoCategory(this)"></div><div class="grid2"><div class="field"><label>Menge</label><input data-f="amount" type="number" min="0" step="any" required value="${i.amount}"></div><div class="field"><label>Einheit</label><select data-f="unit">${['g','kg','ml','l','Stück','EL','TL','Dose','Packung','Bund','Zehe','Prise','Flasche','Becher','Kasten','Tube'].map(u=>`<option ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div><div class="field"><label>Supermarktabteilung</label><select data-f="category" onchange="this.dataset.manual=1">${cats.map((c,j)=>`<option value="${j}" ${i.category===j?'selected':''}>${c}</option>`).join('')}</select></div></div>`}function autoCategory(input){let sel=input.closest('.ingredient')?.querySelector('[data-f=category]');if(sel&&!sel.dataset.manual)sel.value=guessCategory(input.value)}function addOptional(){let e=document.getElementById('optionalFields');e.insertAdjacentHTML('beforeend',ingredientField({name:'',amount:1,unit:'Stück',category:4},e.children.length))}function readOptionals(){return [...document.querySelectorAll('#optionalFields .ingredient')].map(e=>({name:e.querySelector('[data-f=name]').value.trim(),amount:Number(e.querySelector('[data-f=amount]').value),unit:e.querySelector('[data-f=unit]').value,category:Number(e.querySelector('[data-f=category]').value)})).filter(x=>x.name)}function addIngredient(){let e=document.getElementById('ingredientFields');e.insertAdjacentHTML('beforeend',ingredientField({name:'',amount:1,unit:'g',category:4},e.children.length))}function saveRecipe(ev){ev.preventDefault();let f=ev.target,ing=[...f.querySelectorAll('#ingredientFields .ingredient')].map(e=>({name:e.querySelector('[data-f=name]').value.trim(),amount:Number(e.querySelector('[data-f=amount]').value),unit:e.querySelector('[data-f=unit]').value,category:Number(e.querySelector('[data-f=category]').value)})).filter(x=>x.name);if(!ing.length){alert('Bitte mindestens eine Zutat angeben.');return}let id=recipeEdit||uid(),r={id,name:f.elements.name.value.trim(),servings:Number(f.elements.servings.value),minutes:Number(f.elements.minutes.value)||null,steps:f.elements.steps.value,ingredients:ing,optionalIngredients:readOptionals(),sourceUrl:state.recipes.find(x=>x.id===id)?.sourceUrl||'',image:draftRecipeImage===null?state.recipes.find(x=>x.id===id)?.image||'':draftRecipeImage};if(recipeEdit)state.recipes=state.recipes.map(x=>x.id===id?r:x);else state.recipes.push(r);recipeEdit=id;save();go(window.fromPick?'pick':'recipeDetail')}
function normalized(i){let unit=i.unit,amount=Number(i.amount);if(unit==='kg'){unit='g';amount*=1000}else if(unit==='l'){unit='ml';amount*=1000}return {unit,amount}}function listItems(){let map=new Map();for(let [key,s] of (Array.isArray(state.recipePool)?state.recipePool.slice(0,state.mealCount||state.recipePool.length).map((p,i)=>['pool-'+i,{...p,enabled:true}]):Object.entries(state.plan.slots))){if(!s.enabled||!s.recipeId)continue;let d=key.slice(0,10);if(!key.startsWith('pool-')&&(d<state.plan.start||d>state.plan.end))continue;let r=state.recipes.find(r=>r.id===s.recipeId);if(!r)continue;for(let i of [...r.ingredients,...(r.optionalIngredients||[]).filter((_,n)=>(s.selectedOptional||[]).includes(n))]){let x=normalized(i),k='recipe:'+i.name.trim().toLowerCase()+'|'+x.unit+'|'+i.category;if(!map.has(k))map.set(k,{key:k,name:i.name,amount:0,unit:x.unit,category:i.category,source:'recipe'});map.get(k).amount+=x.amount*s.people/r.servings}if(s.optionReminder){let k='reminder:'+key;map.set(k,{key:k,name:'Belag / Füllung für '+r.name,amount:1,unit:'Notiz',category:8,source:'recipe'})}}for(let i of state.manual){let x=normalized(i),k='manual:'+i.id;map.set(k,{key:k,name:i.name,amount:x.amount,unit:x.unit,category:i.category,source:'manual'})}return [...map.values()].map(i=>({...i,amount:state.overrides[i.key]?.amount??i.amount,category:state.overrides[i.key]?.category??i.category})).sort((a,b)=>a.category-b.category||a.name.localeCompare(b.name,'de'))}function fmtAmount(n){return Number(n.toFixed(3)).toLocaleString('de-DE',{maximumFractionDigits:3})}function shopView(){let items=listItems(),done=items.filter(i=>state.checks[i.key]).length;return `<div class="row between"><h2>Einkaufsliste</h2><button class="tinybtn" onclick="go('articles')">＋ Artikel</button></div><p class="muted">${esc(fmtDate(state.plan.start))} – ${esc(fmtDate(state.plan.end))}</p><div class="card"><div class="row between"><b>Einkaufsfortschritt</b><span class="muted">${done} / ${items.length}</span></div><div class="progress" style="margin-top:12px"><div style="width:${items.length?done/items.length*100:0}%"></div></div></div>${items.length?cats.map((c,n)=>{let group=items.filter(i=>i.category===n);return group.length?`<div class="card"><h3>${c}</h3>${group.map(i=>`<div class="checkline ${state.checks[i.key]?'done':''}"><input type="checkbox" aria-label="${esc(i.name)} abhaken" ${state.checks[i.key]?'checked':''} onchange="checkItem('${esc(i.key)}',this.checked)"><span class="grow itemname"><b>${fmtAmount(i.amount)} ${esc(i.unit)}</b> ${esc(i.name)}</span><button class="tinybtn" onclick="editItem('${esc(i.key)}')" aria-label="Artikel bearbeiten">⋯</button></div>`).join('')}</div>`:''}).join(''):'<div class="empty">Deine Liste ist noch leer. Wähle zuerst Rezepte im Mahlzeitenplan oder füge Artikel hinzu.</div>'}<div class="sticky"><button class="primary wide" onclick="go('articles')">＋ Artikel hinzufügen</button></div>`}function checkItem(k,v){state.checks[k]=v;save();render()}function editItem(k){let i=listItems().find(i=>i.key===k);if(!i)return;let a=prompt('Menge für '+i.name+' ('+i.unit+')',String(i.amount));if(a===null)return;let n=Number(a.replace(',','.'));if(!Number.isFinite(n)||n<0){alert('Bitte gültige Menge eingeben.');return}let c=prompt('Kategorie (0–8):\n'+cats.map((x,j)=>j+': '+x).join('\n'),String(i.category));if(c===null)return;let cat=Number(c);if(!Number.isInteger(cat)||cat<0||cat>=cats.length){alert('Ungültige Kategorie.');return}if(i.source==='manual'){let m=state.manual.find(x=>'manual:'+x.id===k);if(m){m.amount=n;m.unit=i.unit;m.category=cat}}else state.overrides[k]={amount:n,category:cat};save();render()}
function articlesView(){return `<button class="ghost" onclick="go('shop')">← Einkaufsliste</button><h2>Artikel hinzufügen</h2><p class="muted">Aus deiner Artikelbibliothek oder als neuer Artikel.</p><input placeholder="Artikel suchen ..." value="${esc(articleSearch)}" oninput="articleSearch=this.value;document.getElementById('articleResults').innerHTML=articleResults()"><div id="articleResults">${articleResults()}</div><div class="card"><h3>Neuen Artikel anlegen</h3><form onsubmit="createArticle(event)"><div class="field"><label>Artikelname</label><input name="name" required placeholder="z. B. Hafermilch"></div><div class="grid2"><div class="field"><label>Standardmenge</label><input name="amount" type="number" min="0" step="any" value="1" required></div><div class="field"><label>Einheit</label><select name="unit">${['Stück','g','kg','ml','l','Packung','Dose','Bund'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Kategorie</label><select name="category">${cats.map((x,j)=>`<option value="${j}">${x}</option>`).join('')}</select></div><button class="secondary wide">In Bibliothek speichern</button></form></div>`}function articleResults(){return state.articles.filter(x=>x.name.toLowerCase().includes(articleSearch.toLowerCase())).map(a=>`<div class="card row"><div class="grow"><b>${esc(a.name)}</b><div class="muted">${fmtAmount(a.amount)} ${esc(a.unit)} · ${cats[a.category]}</div></div><button class="tinybtn" onclick="addManual('${a.id}')">＋ Liste</button><button class="ghost" onclick="deleteArticle('${a.id}')" aria-label="Artikel löschen">×</button></div>`).join('')||'<p class="muted">Keine passenden Artikel.</p>'}function addManual(id){let a=state.articles.find(x=>x.id===id);if(!a)return;state.manual.push({...a,id:uid()});save();go('shop')}function deleteArticle(id){if(!confirm('Artikel aus Bibliothek löschen?'))return;state.articles=state.articles.filter(a=>a.id!==id);save();render()}function createArticle(e){e.preventDefault();let f=e.target;state.articles.push({id:uid(),name:f.elements.name.value.trim(),amount:Number(f.elements.amount.value),unit:f.elements.unit.value,category:Number(f.elements.category.value)});save();render()}
function settingsView(){return `<h2>Einstellungen & Daten</h2><div class="card"><h3>Deine Daten</h3><p>Mealist speichert diese erste Version lokal im Browser dieses Geräts. Sichere deine Daten regelmäßig.</p><button class="primary wide" onclick="exportData()">Backup herunterladen</button><div class="field"><label>Backup wiederherstellen (JSON)</label><input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></div></div><div class="card"><h3>Über diese Version</h3><p>Mealist · Lokale Speicherung · Ohne Anmeldung</p><p class="muted">URL-Import funktioniert bei Seiten mit auslesbaren Rezeptdaten. Manche Websites blockieren den Zugriff; dann bitte Rezepttext einfügen.</p></div>`}function exportData(){let blob=new Blob([JSON.stringify({format:'mealist-v1',data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mealist-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(f){if(!f)return;try{let o=JSON.parse(await f.text());if(o.format!=='mealist-v1'||!o.data||!Array.isArray(o.data.recipes)||!Array.isArray(o.data.articles)||!o.data.plan||!Array.isArray(o.data.manual))throw Error('Ungültiges Mealist-Backup');if(!confirm('Alle aktuellen Daten durch dieses Backup ersetzen?'))return;state=o.data;save();go('home');alert('Backup wiederhergestellt.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}}if(state.plan.end>plusDays(state.plan.start,6)){state.plan.end=plusDays(state.plan.start,6);save()}
const starter=[['Bananen',6,'Stück',0],['Äpfel',1,'kg',0],['Gurken',1,'Stück',0],['Kartoffeln',1,'kg',0],['Zwiebeln',1,'kg',0],['Tomaten',500,'g',0],['Paprika',3,'Stück',0],['Karotten',1,'kg',0],['Champignons',250,'g',0],['Zucchini',2,'Stück',0],['Salat',1,'Stück',0],['Hähnchenbrust',500,'g',1],['Hackfleisch',500,'g',1],['Lachs',300,'g',1],['Schinken',1,'Packung',1],['Salami',1,'Packung',1],['Milch',1,'l',2],['Butter',250,'g',2],['Eier',10,'Stück',2],['Joghurt',500,'g',2],['Käse',200,'g',2],['Mozzarella',1,'Packung',2],['Sahne',200,'ml',2],['Quark',500,'g',2],['Frischkäse',1,'Packung',2],['Brot',1,'Stück',3],['Brötchen',6,'Stück',3],['Toast',1,'Packung',3],['Wraps',1,'Packung',3],['Pizzateig mit Soße',1,'Packung',3],['Nudeln',500,'g',4],['Reis',500,'g',4],['Mehl',1,'kg',4],['Zucker',1,'kg',4],['Salz',1,'Packung',4],['Pfeffer',1,'Packung',4],['Olivenöl',1,'Flasche',4],['Rapsöl',1,'Flasche',4],['Passierte Tomaten',1,'Packung',4],['Mais',1,'Dose',4],['Kidneybohnen',1,'Dose',4],['Kokosmilch',1,'Dose',4],['Haferflocken',500,'g',4],['TK-Gemüse',1,'Packung',5],['TK-Pizza',1,'Packung',5],['Eis',1,'Packung',5],['Wasser',1,'Kasten',6],['Saft',1,'Flasche',6],['Kaffee',1,'Packung',6],['Tee',1,'Packung',6],['Toilettenpapier',1,'Packung',7],['Küchenrolle',1,'Packung',7],['Spülmittel',1,'Flasche',7],['Waschmittel',1,'Packung',7],['Seife',1,'Stück',7],['Zahnpasta',1,'Tube',7],['Müllbeutel',1,'Packung',7],['Spülmaschinentabs',1,'Packung',7]];
function seedArticles(){if(state.librarySeeded)return;let seen=new Set(state.articles.map(a=>a.name.toLowerCase()));starter.forEach(([name,amount,unit,category])=>{if(!seen.has(name.toLowerCase()))state.articles.push({id:uid(),name,amount,unit,category})});state.librarySeeded=true;save()}
function guessCategory(name){let n=name.toLowerCase().trim();return state.articles.find(a=>a.name.toLowerCase()===n)?.category??starter.find(a=>a[0].toLowerCase()===n)?.[3]??4}
function chooseOptions(d,k){let sl=slot(d,k),r=state.recipes.find(x=>x.id===sl.recipeId);if(!r)return;recipePick={d,k};screen='options';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.innerHTML=`<button class="ghost" onclick="backToDay()">← Zurück</button><h2>${esc(r.name)} – Füllung / Belag</h2><p>Nur ausgewählte Vorschläge landen auf der Einkaufsliste.</p>${(r.optionalIngredients||[]).map((i,n)=>`<label class="checkline"><input type="checkbox" data-opt="${n}" ${(sl.selectedOptional||[]).includes(n)?'checked':''}><span>${esc(i.amount)} ${esc(i.unit)} ${esc(i.name)}</span></label>`).join('')}<label class="checkline"><input id="optionReminder" type="checkbox" ${sl.optionReminder?'checked':''}><span>Stattdessen oder zusätzlich: „Belag / Füllung aussuchen“</span></label><button class="primary wide" onclick="saveOptions('${d}','${k}')">Auswahl übernehmen</button>`;scrollTo(0,0)}
function saveOptions(d,k){let sl=slot(d,k);sl.selectedOptional=[...document.querySelectorAll('[data-opt]:checked')].map(x=>Number(x.dataset.opt));sl.optionReminder=document.getElementById('optionReminder').checked;save();backToDay()}
let collapsedCats={},hideDone=false,articleSelection=new Set();
function toggleCat(n){collapsedCats[n]=!collapsedCats[n];render()}
function toggleDone(){hideDone=!hideDone;render()}
function shopView(){let items=listItems(),done=items.filter(i=>state.checks[i.key]).length;return `<div class="row between"><h2>Einkaufsliste</h2><button class="tinybtn" onclick="go('articles')">＋ Artikel</button></div><p class="muted">${esc(fmtDate(state.plan.start))} – ${esc(fmtDate(state.plan.end))}</p><div class="card"><div class="row between"><b>Einkaufsfortschritt</b><span class="muted">${done} / ${items.length}</span></div><div class="progress" style="margin-top:12px"><div style="width:${items.length?done/items.length*100:0}%"></div></div><label class="row" style="margin-top:14px"><input type="checkbox" ${hideDone?'checked':''} onchange="toggleDone()"> Erledigte ausblenden</label></div>${items.length?cats.map((c,n)=>{let all=items.filter(i=>i.category===n),group=all.filter(i=>!hideDone||!state.checks[i.key]);if(!all.length)return '';let complete=all.filter(i=>state.checks[i.key]).length;return `<div class="card"><button class="cathead" onclick="toggleCat(${n})"><b>${esc(c)}</b><span class="muted">${complete}/${all.length} ✓ &nbsp;${collapsedCats[n]?'▸':'▾'}</span></button>${collapsedCats[n]?'':group.map(i=>`<div class="checkline ${state.checks[i.key]?'done':''}"><input type="checkbox" ${state.checks[i.key]?'checked':''} onchange="checkItem('${esc(i.key)}',this.checked)"><span class="grow itemname"><b>${fmtAmount(i.amount)} ${esc(i.unit)}</b> ${esc(i.name)}</span><button class="tinybtn" onclick="editItem('${esc(i.key)}')">⋯</button></div>`).join('')||'<p class="muted">Alle Artikel erledigt.</p>'}</div>`}).join(''):'<div class="empty">Noch keine Artikel. Plane Rezepte oder füge Artikel hinzu.</div>'}<div class="sticky"><button class="primary wide" onclick="go('articles')">＋ Artikel hinzufügen</button></div>`}
function articlesView(){return `<button class="ghost" onclick="go('shop')">← Einkaufsliste</button><h2>Zusatzartikel</h2><p class="muted">Mehrere Artikel auswählen oder einen neuen anlegen. Alle Artikel sind bearbeitbar.</p><input placeholder="Artikel suchen …" value="${esc(articleSearch)}" oninput="articleSearch=this.value;document.getElementById('articleResults').innerHTML=articleResults()"><div id="articleResults">${articleResults()}</div><div class="sticky"><button class="primary wide" onclick="addSelected()">Ausgewählte Artikel hinzufügen (<span id="selCount">${articleSelection.size}</span>)</button></div><div class="card"><h3>Neuen Artikel anlegen</h3><form onsubmit="createArticle(event)"><div class="field"><label>Name</label><input name="name" required></div><div class="grid2"><div class="field"><label>Standardmenge</label><input name="amount" type="number" min="0" step="any" value="1" required></div><div class="field"><label>Einheit</label><select name="unit">${['Stück','g','kg','ml','l','Packung','Dose','Bund','Flasche','Kasten','Tube'].map(u=>`<option>${u}</option>`).join('')}</select></div></div><div class="field"><label>Kategorie</label><select name="category">${cats.map((c,n)=>`<option value="${n}">${esc(c)}</option>`).join('')}</select></div><button class="secondary wide">In Bibliothek speichern</button></form></div>`}
function articleResults(){let filtered=state.articles.filter(a=>a.name.toLowerCase().includes(articleSearch.toLowerCase()));return cats.map((c,n)=>{let group=filtered.filter(a=>a.category===n).sort((a,b)=>a.name.localeCompare(b.name,'de'));return group.length?`<div class="card"><h3>${esc(c)}</h3>${group.map(a=>`<div class="checkline"><input type="checkbox" aria-label="${esc(a.name)} auswählen" ${articleSelection.has(a.id)?'checked':''} onchange="selectArticle('${a.id}',this.checked)"><span class="grow"><b>${esc(a.name)}</b><div class="muted">${fmtAmount(a.amount)} ${esc(a.unit)}</div></span><button class="tinybtn" onclick="editArticle('${a.id}')">✎</button><button class="ghost" onclick="deleteArticle('${a.id}')">×</button></div>`).join('')}</div>`:''}).join('')||'<p class="muted">Keine Treffer.</p>'}
function selectArticle(id,v){v?articleSelection.add(id):articleSelection.delete(id);let x=document.getElementById('selCount');if(x)x.textContent=articleSelection.size}
function addSelected(){if(!articleSelection.size){alert('Bitte zuerst Artikel auswählen.');return}for(let id of articleSelection){let a=state.articles.find(x=>x.id===id);if(a)state.manual.push({...a,id:uid()})}articleSelection.clear();save();go('shop')}
function editArticle(id){let a=state.articles.find(x=>x.id===id);if(!a)return;let name=prompt('Artikelname',a.name);if(name===null||!name.trim())return;let amount=prompt('Standardmenge',String(a.amount));if(amount===null)return;let num=Number(amount.replace(',','.'));if(!Number.isFinite(num)||num<0)return alert('Ungültige Menge');let unit=prompt('Einheit',a.unit);if(unit===null||!unit.trim())return;let category=prompt('Kategorie (0–8):\n'+cats.map((x,n)=>n+' '+x).join('\n'),String(a.category));if(category===null)return;let c=Number(category);if(!Number.isInteger(c)||c<0||c>8)return alert('Ungültige Kategorie');Object.assign(a,{name:name.trim(),amount:num,unit:unit.trim(),category:c});save();render()}
function createArticle(e){e.preventDefault();let f=e.target;let name=f.elements.name.value.trim();if(!name)return;state.articles.push({id:uid(),name,amount:Number(f.elements.amount.value),unit:f.elements.unit.value,category:Number(f.elements.category.value)});save();render()}
function importView(){return `<button class="ghost" onclick="go('recipes')">← Rezepte</button><h2>Rezept importieren</h2><div class="card"><p>Link zu einer Rezeptseite einfügen. Mealist liest Rezeptdaten über den kostenlosen Rezeptdienst aus. Manche Seiten verhindern dies technisch.</p><div class="field"><label>Rezept-URL</label><input id="recipeUrl" type="url" placeholder="https://…"></div><button class="primary wide" onclick="importUrl()">URL auslesen</button><p class="muted" id="importStatus"></p></div><div class="card"><h3>Alternativ: Rezepttext einfügen</h3><p class="muted">Am besten: Titel in der ersten Zeile, Zutaten mit Mengen darunter, anschließend „Zubereitung:“.</p><textarea id="importText" rows="9" placeholder="Pizza\n1 Packung Pizzateig\n200 g Käse\nZubereitung:\nBelegen und backen."></textarea><button class="secondary wide" onclick="importTextRecipe()">Text übernehmen</button></div>`}
let importedRecipe=null;
function parseIngredient(line){let t=line.trim().replace(/^[•*\-]\s*/,'');let m=t.match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)\s*(kg|g|ml|l|Stück|EL|TL|Dose|Dosen|Packung|Packungen|Bund|Zehe|Zehen|Prise|Flasche|Becher)?\s+(.+)$/i);if(!m)return {name:t,amount:1,unit:'Stück',category:guessCategory(t)};let amt=m[1].includes('/')?m[1].split('/').reduce((a,b)=>Number(a)/Number(b)):Number(m[1].replace(',','.'));let unit=m[2]||'Stück';if(unit.toLowerCase()==='dosen')unit='Dose';if(unit.toLowerCase()==='packungen')unit='Packung';return {name:m[3],amount:amt,unit,category:guessCategory(m[3])}}
function importTextRecipe(){let raw=document.getElementById('importText').value.trim();if(!raw)return alert('Bitte Rezepttext einfügen');let lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean),cut=lines.findIndex(x=>/^(zubereitung|anleitung|zubereitung:)/i.test(x));let name=lines.shift()||'Importiertes Rezept',ingLines=(cut<0?lines:lines.slice(0,Math.max(0,cut-1))).filter(x=>!/^zutaten:?$/i.test(x));let steps=cut<0?'':lines.slice(Math.max(0,cut-1)).join('\n').replace(/^zubereitung:?\s*/i,'');importedRecipe={name,servings:3,minutes:null,ingredients:ingLines.map(parseIngredient),steps,sourceUrl:''};showImportPreview()}
const RECIPE_WORKER='https://mealist-rezeptimport.estelledaniels.workers.dev/';
async function importUrl(){
 let url=document.getElementById('recipeUrl').value.trim(),status=document.getElementById('importStatus');
 try{
  let u=new URL(url);
  if(!['https:','http:'].includes(u.protocol))throw Error('Bitte einen gültigen http(s)-Link eingeben');
  status.textContent='Lese Rezeptdaten …';
  let endpoint=RECIPE_WORKER+'?url='+encodeURIComponent(u.href);
  let response=await fetch(endpoint,{mode:'cors'});
  let data;
  try{data=await response.json()}catch{throw Error('Der Rezeptdienst hat keine gültige Antwort geliefert')}
  if(!response.ok||data.success!==true){throw Error(data.error||data.message||'Rezept konnte nicht ausgelesen werden')}
  let ingredients=Array.isArray(data.ingredients)?data.ingredients:[];
  if(!ingredients.length)throw Error('Keine Zutaten gefunden');
  let servingsValue=Array.isArray(data.servings)?data.servings[0]:data.servings;
  let servings=parseInt(servingsValue,10);
  if(!Number.isFinite(servings)||servings<1)servings=3;
  let instructions=Array.isArray(data.instructions)?data.instructions.map(x=>typeof x==='string'?x:x?.text||'').join('\n'):String(data.instructions||'');
  importedRecipe={name:String(data.name||'Importiertes Rezept'),servings,minutes:null,ingredients:ingredients.map(x=>parseIngredient(String(x))),steps:instructions,sourceUrl:url,image:(typeof data.image==='string'?data.image:Array.isArray(data.image)?data.image[0]?.url||data.image[0]||'':data.image?.url||data.image?.contentUrl||data.images?.[0]?.url||data.images?.[0]||'')};
  showImportPreview();
 }catch(e){status.textContent='Automatischer Import nicht möglich ('+e.message+'). Bitte den Rezepttext von der Seite kopieren und unten einfügen.'}
}function showImportPreview(){draftRecipeImage=null;screen='importPreview';render();scrollTo(0,0)}
function importPreviewView(){let r=importedRecipe;if(!r)return importView();return `<button class="ghost" onclick="go('importRecipe')">← Import</button><h2>Import prüfen</h2><p class="notice">Bitte Zutaten, Mengen und Portionen vor dem Speichern kontrollieren.</p><form onsubmit="saveImported(event)"><div class="field"><label>Rezeptname</label><input name="name" required value="${esc(r.name)}"></div><div class="field"><label>Portionen</label><input name="servings" type="number" min="1" required value="${r.servings}"></div>${imageEditor(r)}<h3>Zutaten</h3><div id="importIngredients">${r.ingredients.map((i,n)=>ingredientField(i,n)).join('')}</div><button type="button" class="secondary" onclick="document.getElementById('importIngredients').insertAdjacentHTML('beforeend',ingredientField({name:'',amount:1,unit:'g',category:4},document.querySelectorAll('#importIngredients .ingredient').length))">＋ Zutat</button><div class="field"><label>Zubereitung</label><textarea name="steps">${esc(r.steps)}</textarea></div><button class="primary wide">Rezept speichern</button></form>`}
function saveImported(e){e.preventDefault();let f=e.target,ingredients=[...document.querySelectorAll('#importIngredients .ingredient')].map(x=>({name:x.querySelector('[data-f=name]').value.trim(),amount:Number(x.querySelector('[data-f=amount]').value),unit:x.querySelector('[data-f=unit]').value,category:Number(x.querySelector('[data-f=category]').value)})).filter(x=>x.name);if(!ingredients.length)return alert('Mindestens eine Zutat benötigt');let id=uid();state.recipes.push({id,name:f.elements.name.value.trim(),servings:Number(f.elements.servings.value),minutes:null,steps:f.elements.steps.value,ingredients,optionalIngredients:[],sourceUrl:importedRecipe.sourceUrl,image:draftRecipeImage===null?recipeImage(importedRecipe):draftRecipeImage});recipeEdit=id;save();go('recipeDetail')}

seedArticles();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
